name: school-system

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school-system-frontend
    ports:
      - "8081:8080"
    environment:
      VITE_API_URL: "http://localhost:3200"
    networks:
      - school-system-net

networks:
  school-system-net:
    driver: bridge
